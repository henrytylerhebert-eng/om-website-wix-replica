name: Deploy OM Website 2.0 Handoff

on:
  push:
    branches: [codex/om/mock-site-v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Upload handoff site
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/wix-copy-experience-handoff
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
